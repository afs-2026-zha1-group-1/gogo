name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run acceptance tests
        run: mvn -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check lockfile portability
        run: node --test tests/lockfile.test.mjs
      - name: Install from the lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (pure helpers)
        run: npm run test:unit
      - name: Build
        run: npm run build