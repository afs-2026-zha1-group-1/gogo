schema: spec-driven

# Project context: constraints that guide artifacts and workflows.
context: |
  Tech baseline: docs/knowledge/architecture/tech-stack-plan.md is binding for
  implementation. Read it before proposing or coding. If a change needs to
  deviate from its stack, data model, or API list, record the conflict in the
  proposal or design instead of deviating silently.

# Per-artifact rules.
rules:
  tasks:
    - Add a final task before archive to reconcile docs/knowledge/architecture/tech-stack-plan.md with what this change actually shipped (implemented capabilities, API list, data model).
    - "Reconcile only features completed by an archived change. Do not sync planned or still-unarchived work into the plan."
    - Append a row to docs/knowledge/_LOG.md whenever the plan is updated.

# Per-operation guidance.
operations:
  archive:
    guidance:
      - Confirm the tech-stack-plan reconciliation task is closed. If the change altered stack, data model, or API, update the plan or record the deviation there.
