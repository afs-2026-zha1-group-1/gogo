  function splitGraph(t) {
	const source = stops(t)
	const fork = t.boundarySaved ? t.boundary[0] : -1
	const join = t.boundarySaved ? t.boundary[1] : -1
	const valid = fork >= 0 && join > fork && join < source.length
	const rows = []
	const routeSteps = [
	  { key: 'a', title: t.routeNames?.A || '探索当地景点', values: t.timing.A },
	  { key: 'b', title: t.routeNames?.B || '咖啡与街区漫步', values: t.timing.B },
	]
	for (let index = 0; index < source.length; index++) {
	  if (valid && index === fork) {
		rows.push({ kind: 'fork', title: source[index].name, meta: `${source[index].time.split(' – ')[1]} · 分头` })
		if (t.generated) {
		  const branches = routeSteps.map(route => [
			{ kind: 'branch', route: route.key, title: route.title, meta: `活动 · ${route.values[0]} 分` },
			{ kind: 'branch', route: route.key, title: '前往会合点', meta: `路程 · ${route.values[1]} 分` },
			...(Number(route.values[2]) ? [{ kind: 'branch', route: route.key, title: '缓冲', meta: `缓冲 · ${route.values[2]} 分` }] : []),
		  ])
		  for (let step = 0; step < Math.max(...branches.map(items => items.length)); step++) {
			for (const branch of branches) if (branch[step]) rows.push(branch[step])
		  }
		}
		continue
	  }
	  if (valid && index === join) {
		rows.push({ kind: 'join', title: source[index].name, meta: `${source[index].time.split(' – ')[0]} · 会合` })
		continue
	  }
	  if (valid && index > fork && index < join) continue
	  rows.push({ kind: 'main', title: source[index].name, meta: source[index].time })
	}
	const rowHeight = 56, pad = 20, width = 320, main = 160, laneA = 188, laneB = 132
	const y = index => pad + rowHeight * index + rowHeight / 2
	const height = pad * 2 + rowHeight * rows.length
	const forkRow = rows.findIndex(row => row.kind === 'fork')
	const joinRow = rows.findIndex(row => row.kind === 'join')
	const last = rows.length - 1
	const branchesExist = rows.some(row => row.kind === 'branch')
	let paths = valid
	  ? `<path d="M${main} ${y(0)} V${y(forkRow)} M${main} ${y(joinRow)} V${y(last)}" stroke="#0d9488" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${main} ${y(forkRow)} V${y(joinRow)}" stroke="#cfccc6" stroke-width="2" stroke-dasharray="4 6" fill="none"/>`
	  : `<path d="M${main} ${y(0)} V${y(last)}" stroke="#0d9488" stroke-width="3" fill="none" stroke-linecap="round"/>`
	if (branchesExist) {
	  for (const [key, lane, color] of [['a', laneA, '#2563eb'], ['b', laneB, '#ea580c']]) {
		const indexes = rows.map((row, index) => row.kind === 'branch' && row.route === key ? index : -1).filter(index => index >= 0)
		if (indexes.length) paths += `<path d="M${main} ${y(forkRow)} C${main} ${y(forkRow) + 28} ${lane} ${y(indexes[0]) - 28} ${lane} ${y(indexes[0])} V${y(indexes[indexes.length - 1])} C${lane} ${y(joinRow) - 28} ${main} ${y(joinRow) - 28} ${main} ${y(joinRow)}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>`
	  }
	}
	const nodes = rows.map((row, index) => {
	  const branch = row.kind === 'branch', junction = row.kind === 'fork' || row.kind === 'join'
	  const cx = branch ? (row.route === 'a' ? laneA : laneB) : main
	  const anchor = branch ? (row.route === 'a' ? 'start' : 'end') : row.kind === 'fork' ? 'start' : row.kind === 'join' ? 'end' : index % 2 === 0 ? 'start' : 'end'
	  const x = branch ? (row.route === 'a' ? laneA + 12 : laneB - 12) : row.kind === 'fork' ? main + 16 : row.kind === 'join' ? main - 16 : anchor === 'start' ? main + 16 : main - 16
	  const color = row.kind === 'fork' ? '#0d9488' : row.kind === 'join' ? '#059669' : branch ? (row.route === 'a' ? '#2563eb' : '#ea580c') : '#0d9488'
	  const limit = branch ? 9 : junction ? 10 : 11
	  const title = row.title.length > limit ? `${row.title.slice(0, limit - 1)}…` : row.title
	  return `${junction ? `<circle cx="${cx}" cy="${y(index)}" r="13" fill="${row.kind === 'fork' ? '#ccfbf1' : '#d7f5e6'}"/>` : ''}<circle cx="${cx}" cy="${y(index)}" r="${junction ? 8 : 6.5}" fill="${color}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y(index) - 6}" text-anchor="${anchor}" font-size="9.5" font-weight="700" fill="#a8a29e">${esc(row.meta)}</text><text x="${x}" y="${y(index) + 11}" text-anchor="${anchor}" font-size="${branch ? 11.5 : junction ? 13 : 12.5}" font-weight="${junction ? 750 : 650}" fill="${row.kind === 'fork' ? '#0f766e' : row.kind === 'join' ? '#047857' : '#1c1917'}">${esc(title)}</text>`
	}).join('')
	return `<div class="team-route-graph"><div class="team-legend-row"><span class="team-legend"><i class="swatch-main"></i>全员主线</span>${branchesExist ? `<span class="team-legend"><i class="swatch-a"></i>Route A · ${esc(t.routeNames?.A||'探索当地景点')}</span><span class="team-legend"><i class="swatch-b"></i>Route B · ${esc(t.routeNames?.B||'咖啡与街区漫步')}</span>` : ''}</div><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="队伍路线图：主线、分头、两条分队路线与会合">${paths}${nodes}</svg></div>`
  }
	function split() {
	const t = trip(), tooFew = t.members.length < 2, confirmedMain = t.plan === 'confirmed'
	const status = t.split === 'confirmed' ? '分队已确认' : t.split === 'draft' ? '分队草稿进行中' : t.split === 'cancelled' ? '上次草稿已取消' : '尚未发起分队'
	const label = tooFew ? '成员不足' : t.split === 'draft' ? '继续分队' : t.split === 'confirmed' ? '查看已确认分队' : '发起分队'
	const disabled = tooFew || (!confirmedMain && t.split !== 'draft' && t.split !== 'confirmed')
	const action = t.split === 'draft' ? 'data-go="split-boundary"' : t.split === 'confirmed' ? 'data-go="split-final"' : 'data-action="start-split"'
	const hint = tooFew ? '成员不足两名，暂不能分队' : !confirmedMain && t.split !== 'confirmed' ? '先确认主线方案' : `点击右上角${t.split === 'confirmed' ? '查看' : '进入'}分队`
	const nodes = stops(t)

	if (!confirmedMain && t.split !== 'confirmed') body += card(`<div class="team-unconfirmed"><span class="team-branch-icon">${icon('fork', true)}</span><div><b>主线方案未确认</b><p>确认主线后才能发起分队；本页只读取已确认主线与分队草稿。</p><button class="text-link" data-go="plan">去主线方案 ${icon('right', true)}</button></div></div>`)
	else if (nodes.length === 0) body += card('<div class="team-empty">已确认主线暂无节点，暂不能展示队伍路线。</div>')
	else {
	  if (t.boundarySaved) {
		const window = windowInfo(t)
		body += `<div class="team-window"><span>${esc(window.start)} 分头</span><i></i><span>${esc(window.end)} 会合</span><small>${window.length} 分钟</small></div>`
	  }
	  body += splitGraph(t)
	  if (t.split === 'draft' && !t.boundarySaved) body += card('<b>待选择分头 / 会合边界</b><p class="hint">选好边界后会显示分头、会合节点和中间暂停的主线。</p>')
	  else if (t.split === 'draft' && t.boundarySaved && !t.generated) body += card('<b>两条路线待生成</b><p class="hint">生成 Route A / B 后会在这里展开两条分支的活动与时长。</p>')
	  else if (t.split === 'cancelled') body += card('<b>草稿已取消，主线未变</b><p class="hint">右上角可发起替换草稿，重新选择边界与路线。</p>')
	  else if (t.split === 'none') body += card('<b>尚未发起分队</b><p class="hint">右上角「发起分队」从已确认主线开始；A/B 路线生成后回到本页。</p>')
	}
	body += '</div>'
	const right = `<button class="btn btn-primary team-top-action" ${action} ${disabled ? 'disabled' : ''}>${esc(label)} ${icon(t.split === 'draft' || t.split === 'confirmed' ? 'right' : 'fork', true)}</button>`
	return shell(header('队伍路线', '本次行程仅一次分队', '', right), body, '', 'split')
  }
	function boundary(){
		const t=trip(),nodes=stops(t),status=boundaryStatus(t)

  app.addEventListener('change',event=>{const el=event.target,t=trip();if(el.id==='currency')t.currency=el.value;if(el.dataset.action==='no-pref'){t.noPref=el.checked;if(t.noPref){t.interests=[];t.budget=''}render()}});
  app.addEventListener('click',event=>{const tab=event.target.closest('.tab');if(tab){event.preventDefault();go(tab.getAttribute('href').slice(1))}});
  app.addEventListener('submit',event=>{event.preventDefault();const form=event.target,data=new FormData(form),value=name=>String(data.get(name)||'').trim(),error=message=>{const el=form.querySelector('#form-error');if(el)el.textContent=message};if(form.id==='login-form'){const email=value('email').toLowerCase(),password=value('password'),demo=accounts.find(name=>name.toLowerCase()+'@example.com'===email);if((demo&&password==='gogo-demo-2026')||(state.registered&&state.registered.email===email&&state.registered.password===password)){state.account={name:demo||state.registered.name,email};trip().members[0].name=state.account.name;go('home')}else error('邮箱或密码不正确。')}else if(form.id==='register-form'){if(value('name').length>30)return error('名字需要 1–30 个字符。');if(new TextEncoder().encode(value('password')).length<8)return error('密码至少需要 8 个字符。');if(value('password')!==value('confirm'))return error('两次输入的密码不一致。');state.registered={name:value('name'),email:value('email').toLowerCase(),password:value('password')};go('login');notice('账号已创建，请登录')}else if(form.id==='create-form'){if(value('start')>value('end'))return error('结束日期不能早于开始日期');const t=makeTrip(value('name'),value('destination'),value('start'),value('end'),value('from'),value('to'),[{name:state.account.name,ready:false}]);t.interests=[...state.defaults];state.trips.push(t);state.current=state.trips.length-1;state.invited=false;go('detail');notice('行程已创建')}else if(form.id==='account-form'){if(value('name').length>30)return error('名字需要 1–30 个字符。');const previous=state.account.name;state.account.name=value('name');state.trips.forEach(t=>{if(t.members[0].name===previous)t.members[0].name=state.account.name});render();notice('已保存')}else if(form.id==='must-form'){if(!value('location')&&!value('time'))return error('地点与时间至少填一项。');trip().must[state.editing]={activity:value('activity'),location:value('location'),time:value('time')};if(trip().plan==='draft')trip().plan='stale';state.editing=-1;render();notice('已保存')}else if(form.id==='join-form'){const t=trip();if(t.members.some(m=>m.name===value('name')))return notice('该成员已加入');t.members.push({name:value('name'),ready:true});state.invited=true;go('members');notice('已加入行程')}});
	app.addEventListener('click',event=>{const target=event.target.closest('[data-action="edit-activity-info"],[data-action="cancel-activity-info"]');if(!target)return;event.preventDefault();event.stopImmediatePropagation();if(target.dataset.action==='edit-activity-info'){if(state.account?.name!==trip().members[0]?.name)return notice('仅组织者可编辑活动信息');state.activityEditing=target.dataset.activityKey}else state.activityEditing=null;render()});
	app.addEventListener('submit',event=>{const form=event.target;if(form.id!=='activity-info-form')return;event.preventDefault();event.stopImmediatePropagation();if(state.account?.name!==trip().members[0]?.name){state.activityEditing=null;render();return notice('仅组织者可保存活动信息')}const data=new FormData(form),cost=String(data.get('cost')??'').trim();if(cost!==''&&(!Number.isFinite(Number(cost))||Number(cost)<0)){const error=form.querySelector('#activity-info-error');if(error)error.textContent='费用需为不小于 0 的数字；未知费用请留空。';return}const key=form.dataset.activityKey,t=trip();t.activityInfo=t.activityInfo||{};t.activityInfo[key]={address:String(data.get('address')||'').trim(),reservation:String(data.get('reservation')||'').trim(),hours:String(data.get('hours')||'').trim(),transport:String(data.get('transport')||'').trim(),...(cost===''?{}:{cost:Number(cost)})};state.activityEditing=null;render();notice('活动信息已保存')});
	function invitationRecord(token,t){const record={name:t.name,destination:t.destination,start:t.start,end:t.end,closed:t.plan==='confirmed'};state.inviteMetadata[token]=record;try{const saved=JSON.parse(localStorage.getItem('gogo.prototype.invites')||'{}');saved[token]=record;localStorage.setItem('gogo.prototype.invites',JSON.stringify(saved))}catch{}return record;}
	function invitationUrl(t){if(!t.invitationToken){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);t.invitationToken=Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('')}invitationRecord(t.invitationToken,t);return location.href.split('#')[0]+'#/join/'+t.invitationToken;}
	function openInvitationHash(){if(!location.hash.startsWith('#/join/'))return false;try{const token=location.hash.slice('#/join/'.length);if(!/^[0-9a-f]{32}$/.test(token))throw Error('bad-token');let data=state.inviteMetadata[token];if(!data)try{data=JSON.parse(localStorage.getItem('gogo.prototype.invites')||'{}')[token]}catch{}if(!data||![data.name,data.destination,data.start,data.end].every(value=>typeof value==='string'&&value.length>0&&value.length<200)||typeof data.closed!=='boolean')throw Error('unknown-token');const matching=state.trips.find(value=>value.invitationToken===token);state.invitationTrip=matching&&!data.closed?matching:makeTrip(data.name,data.destination,data.start,data.end,'','',[{name:'组织者',ready:false}]);if(state.invitationTrip!==matching)state.invitationTrip.plan=data.closed?'confirmed':'none';state.invalidInvitation=false;}catch{state.invitationTrip=null;state.invalidInvitation=true}state.joined=null;state.openedInvitation=true;go('join');return true;}
  app.addEventListener('click',async event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(!['copy','preview','accept-invitation','joined-detail','joined-home'].includes(action))return;event.stopImmediatePropagation();if(action==='copy'){const field=app.querySelector('[aria-label="邀请链接"]');try{await navigator.clipboard.writeText(field.value);notice('已复制邀请链接')}catch{field.focus();field.select();notice('请选择并复制链接')}return}if(action==='preview'){state.invalidInvitation=false;go('join');return}if(action==='joined-home'){state.joined=null;go(state.account?'home':'login');return}if(action==='joined-detail'){const index=state.trips.indexOf(state.invitationTrip);if(index>=0)state.current=index;go('detail');return}if(!state.account){state.pendingInvitation=true;go('login');return}const invited=state.invitationTrip||trip();if(invited.plan==='confirmed'){render();return}const existing=invited.members.some(member=>member.name.toLowerCase()===state.account.name.toLowerCase());if(!existing)invited.members.push({name:state.account.name,ready:false});if(!state.trips.includes(invited))state.trips.push(invited);state.joined=existing?'existing':'new';render();},true);
  app.addEventListener('submit',event=>{if(event.target.id!=='login-form'||!state.pendingInvitation)return;event.preventDefault();event.stopImmediatePropagation();const data=new FormData(event.target),email=String(data.get('email')).trim().toLowerCase(),password=String(data.get('password')),demo=accounts.find(name=>name.toLowerCase()+'@example.com'===email);if((demo&&password==='gogo-demo-2026')||(state.registered&&state.registered.email===email&&state.registered.password===password)){state.account={name:demo||state.registered.name,email};state.pendingInvitation=false;state.openedInvitation=true;go('join')}else event.target.querySelector('#form-error').textContent='邮箱或密码不正确。';},true);
  window.addEventListener('hashchange',()=>{if(openInvitationHash())return;const page=location.hash.slice(1);if(!state.account&&page!=='register'){go('login');return}if(['home','trips','split','members','account','register','join'].includes(page))go(page)});
	app.addEventListener('click',event=>{const button=event.target.closest('[data-scan]');if(!button)return;if(button.dataset.scan==='close'&&['scanning','simulating'].includes(state.scanner.kind)){event.preventDefault();event.stopImmediatePropagation();stopScanner();render()}else if(button.dataset.scan==='retry'){event.preventDefault();event.stopImmediatePropagation();stopScanner();render()}},true);
	app.addEventListener('click',event=>{const chip=event.target.closest('[data-boundary]');if(chip){event.preventDefault();event.stopImmediatePropagation();const t=trip(),slot=chip.dataset.boundary==='departure'?0:1;t.boundary[slot]=Number(chip.dataset.index);const status=boundaryStatus(t);if(status.valid){t.savedBoundary=[...t.boundary];t.boundarySaved=true;t.boundaryError=''}else{t.savedBoundary=null;t.boundarySaved=false;t.boundaryError=status.complete?status.error:''}render();return}const button=event.target.closest('button');if(!button)return;if(button.dataset.action==='start-split'){const t=trip();t.boundary=[null,null];t.savedBoundary=null;t.boundarySaved=false;t.boundaryError='';return}if(button.dataset.go==='split-boundary'){const t=trip();t.boundary=t.savedBoundary?[...t.savedBoundary]:[null,null];t.boundaryError='';return}if(button.dataset.action==='reset-boundary'){event.preventDefault();event.stopImmediatePropagation();const t=trip();t.boundary=[null,null];t.savedBoundary=null;t.boundarySaved=false;t.boundaryError='';render();notice('已重置边界');return}if(button.dataset.action!=='save-boundary')return;event.preventDefault();event.stopImmediatePropagation();const t=trip(),status=boundaryStatus(t);if(!status.valid){t.boundaryError=status.complete?status.error:'请选择分头节点和会合节点。';render();return}t.savedBoundary=[...t.boundary];t.boundarySaved=true;t.boundaryError='';render();notice('边界已保存')},true);
	window.setInterval(()=>{if(state.page==='trips'||state.page==='detail'){const container=app.querySelector('[data-countdown-container]');if(container)container.innerHTML=countdownContent(trip())}},1000);
	bindScannerControls();
	if(!openInvitationHash())render();
})();
</script>
</body>
