spring:
  application:
    name: gogo-backend
  datasource:
    # SQLite three iron rules (design D4): WAL + busy_timeout=5000 + foreign_keys=on, single writer pool=1.
    url: jdbc:sqlite:./data/gogo.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

gogo:
  plan:
    ai:
      api-key: ${LLM_API_KEY:}
      base-url: ${PLAN_AI_BASE_URL:https://mlop-llm-gateway-dev.home-np.oocl.com/v2/openai/deployments/ali-copilot}
      model: ${PLAN_AI_MODEL:deepseek-v4.1-flash}
      # Reasoning models spend tokens before emitting content; multi-day plans need headroom.
      max-tokens: ${PLAN_AI_MAX_TOKENS:16384}
      timeout: ${PLAN_AI_TIMEOUT:90s}
